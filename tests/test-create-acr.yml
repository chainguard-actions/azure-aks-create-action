name: Test create with ACR enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with CREATE_ACR=true (expect failure at terraform init — no real Azure backend)
        id: action
        uses: .
        continue-on-error: true
        with:
          ARM_CLIENT_ID: fake-client-id
          ARM_CLIENT_SECRET: fake-client-secret
          ARM_SUBSCRIPTION_ID: fake-subscription-id
          ARM_TENANT_ID: fake-tenant-id
          RESOURCE_GROUP_NAME: test-rg
          CLUSTER_NAME: test-cluster
          CLUSTER_SIZE: dev
          STORAGE_ACCOUNT_NAME: fakestorageaccount
          STORAGE_CONTAINER_NAME: fakecontainer
          STORAGE_ACCESS_KEY: fake-access-key
          ACTION_TYPE: create
          CREATE_ACR: 'true'

      - name: Assert action ran with CREATE_ACR=true
        run: |
          # The action should fail at terraform init (no real Azure backend),
          # but it must have started and attempted to run.
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped — it never ran"
            exit 1
          fi
          echo "PASS: action ran with CREATE_ACR=true (outcome=$OUTCOME, expected failure at terraform init without real Azure credentials)"
