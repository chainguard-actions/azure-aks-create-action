name: Test AKS Create Action - Dev Cluster Create
on:
  workflow_dispatch:
jobs:
  test-create-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action inputs are accepted (create dev cluster)
        # This action requires real Azure credentials and runs Terraform.
        # We verify the action can be invoked with all required inputs.
        # The action will fail at terraform init without real credentials,
        # which is expected in a test environment.
        id: action
        uses: .
        continue-on-error: true
        with:
          ARM_CLIENT_ID: "test-client-id"
          ARM_CLIENT_SECRET: "test-client-secret"
          ARM_SUBSCRIPTION_ID: "test-subscription-id"
          ARM_TENANT_ID: "test-tenant-id"
          RESOURCE_GROUP_NAME: "test-resource-group"
          CLUSTER_NAME: "test-cluster"
          CLUSTER_SIZE: "dev"
          STORAGE_ACCOUNT_NAME: "teststorageaccount"
          STORAGE_CONTAINER_NAME: "test-container"
          STORAGE_ACCESS_KEY: "test-access-key"
          ACTION_TYPE: "create"
          CREATE_ACR: "false"

      - name: Assert action was invoked (failure expected without real credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should fail at terraform init (no real Azure credentials),
          # but it must NOT succeed unexpectedly.
          # A 'failure' outcome means the Docker container ran and the entrypoint executed.
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "WARN: Action succeeded unexpectedly - real Azure credentials may be present"
          elif [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: Action ran and failed at terraform init as expected (no real credentials)"
          else
            echo "FAIL: Unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
