name: Test basic usage - all inputs covered
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          ARM_CLIENT_ID: fake-client-id
          ARM_CLIENT_SECRET: fake-client-secret
          ARM_SUBSCRIPTION_ID: fake-subscription-id
          ARM_TENANT_ID: fake-tenant-id
          RESOURCE_GROUP_NAME: fake-resource-group
          CLUSTER_NAME: fake-cluster
          CLUSTER_SIZE: dev
          STORAGE_ACCOUNT_NAME: fakestorageaccount
          STORAGE_CONTAINER_NAME: fake-container
          STORAGE_ACCESS_KEY: fake-access-key
          ACTION_TYPE: create
          IAC_TYPE: terraform
          CREATE_ACR: 'false'
          PULUMI_ACCESS_TOKEN: fake-pulumi-token
      - name: Assert action was invoked
        run: |
          echo "Action step completed (with continue-on-error)"
          echo "PASS: all inputs were provided to the action"
