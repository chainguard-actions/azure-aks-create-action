name: Test default input values (CLUSTER_SIZE=dev, ACTION_TYPE=create)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default inputs (expect failure with fake credentials)
        id: action
        continue-on-error: true
        uses: .
        with:
          ARM_CLIENT_ID: fake-client-id
          ARM_CLIENT_SECRET: fake-client-secret
          ARM_SUBSCRIPTION_ID: fake-subscription-id
          ARM_TENANT_ID: fake-tenant-id
          RESOURCE_GROUP_NAME: fake-resource-group
          CLUSTER_NAME: fake-cluster-defaults
          STORAGE_ACCOUNT_NAME: fakestorageaccount
          STORAGE_CONTAINER_NAME: fake-container
          STORAGE_ACCESS_KEY: fake-access-key

      - name: Assert action ran with defaults and failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake credentials, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action with default inputs failed as expected"
