name: Test default inputs scenario
on:
  workflow_dispatch:
jobs:
  test-default-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with only required inputs (use defaults for CLUSTER_SIZE and ACTION_TYPE)
        id: action
        uses: .
        continue-on-error: true
        with:
          ARM_CLIENT_ID: fake-client-id
          ARM_CLIENT_SECRET: fake-client-secret
          ARM_SUBSCRIPTION_ID: fake-subscription-id
          ARM_TENANT_ID: fake-tenant-id
          RESOURCE_GROUP_NAME: test-resource-group
          CLUSTER_NAME: test-cluster-defaults
          STORAGE_ACCOUNT_NAME: fakestorageaccount
          STORAGE_CONTAINER_NAME: fakecontainer
          STORAGE_ACCESS_KEY: fake-access-key

      - name: Assert action was invoked with default inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail because there are no real Azure credentials,
          # but it should NOT be skipped — it must have been invoked.
          # Default CLUSTER_SIZE=dev and ACTION_TYPE=create should be used.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with default inputs (CLUSTER_SIZE=dev, ACTION_TYPE=create) (outcome=$OUTCOME)"
